<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="global.css">
    </head>
    <body>
        <h1 class="teenquest">TeenQuest</h1>
        <img src="assets/logo.png" alt="TeenQuest Logo" style="width:100px;height:100px;">
        <h2>Create an account</h2>
        <p>Enter your email to sign up for TeenQuest</p>
        <input type="email" placeholder="email@domain.com" autocomplete="off" class="in-email">
        <button class="continue-button">Continue</button>
        <p class="login-text">
          Have an account? <a href="login/login.html">Log in</a>
        </p>
        <span class="divider">--------------------------------------or--------------------------------------</span>
        <button class="social-btn google">
          <img src="assets/google-logo.png" alt="Google logo">
          Continue with Google
        </button>
        <button class="social-btn apple">
          <img src="assets/apple-logo.png" alt="Apple logo">
          Continue with Apple
        </button>
    </body>
</html>
