<!DOCTYPE html>
<html>
    <head>
        <title>Signup - TeenQuest</title>
        <link rel="stylesheet" href="/app/global.css">
    </head>
    <body>
        <h2>Create Account</h2>
        <label for="name" class="in-group">Full Name:</label>
        <input type="text" id="name" placeholder="Ex: John Doe" required class="in-global"/>


        <label for="email" class="in-group">Email:</label>
        <input type="email" id="email" placeholder="email@domain.com" required class="in-global"/>

        <label for="password" class="in-group">Password:</label>
        <input type="password" id="password" placeholder="password" required class="in-global"/>


        <label for="confirm" class="in-group">Confirm Password:</label>
        <input type="password" id="confirm" placeholder="confirm password" required class="in-global"/>

        <button type="submit" class="global-button">Sign Up</button>
        </div>
    </body>
</html>
